name: Run Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Create config.properties from secrets
        run: |
          cat > config.properties << EOF
          long.wait=60
          short.wait=2
          text.wait=2
          base.url=https://mymarket.ge/
          login.mail=${{ secrets.LOGIN_MAIL }}
          login.password=${{ secrets.LOGIN_PASSWORD }}
          user.id=${{ secrets.USER_ID }}
          visit.url=https://www.mymarket.ge/ka/pr-form/
          login.url=https://auth.tnet.ge/ka/user/login?Continue=https%3A%2F%2Fwww.mymarket.ge%2Fka%2F
          EOF

      - name: Run tests
        run: mvn clean test -Dheadless=true

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: report/
          retention-days: 7

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7